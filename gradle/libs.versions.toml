[versions]
agp = "9.1.1"
junit = "4.13.2"
ftc-sdk = "11.2.1"
dashboard = "0.5.1"
ejml = "0.46.1"
kotlinGradlePlugin = "KGP_VERSION"
kotlinxCoroutinesTest = "1.11.0"
mockitoCore = "5.23.0"
roadrunner-core = "1.0.1"
roadrunner-actions = "1.0.1"
roadrunner-ftc = "0.1.25"

# SDK Versions
compileSdk = "36"
minSdk = "24"
#noinspection OldTargetApi
targetSdk = "36"

[libraries]
# FTC SDK
ftc-inspection = { group = "org.firstinspires.ftc", name = "Inspection", version.ref = "ftc-sdk" }
ftc-blocks = { group = "org.firstinspires.ftc", name = "Blocks", version.ref = "ftc-sdk" }
ftc-robotcore = { group = "org.firstinspires.ftc", name = "RobotCore", version.ref = "ftc-sdk" }
ftc-robotserver = { group = "org.firstinspires.ftc", name = "RobotServer", version.ref = "ftc-sdk" }
ftc-onbotjava = { group = "org.firstinspires.ftc", name = "OnBotJava", version.ref = "ftc-sdk" }
ftc-hardware = { group = "org.firstinspires.ftc", name = "Hardware", version.ref = "ftc-sdk" }
ftc-ftccommon = { group = "org.firstinspires.ftc", name = "FtcCommon", version.ref = "ftc-sdk" }
ftc-vision = { group = "org.firstinspires.ftc", name = "Vision", version.ref = "ftc-sdk" }

# Dashboard
acmerobotics-dashboard = { group = "com.acmerobotics.dashboard", name = "dashboard", version.ref = "dashboard" }


# Others
ejml-simple = { group = "org.ejml", name = "ejml-simple", version.ref = "ejml" }

# RoadRunner
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinGradlePlugin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockitoCore" }
roadrunner-core = { group = "com.acmerobotics.roadrunner", name = "core", version.ref = "roadrunner-core" }
roadrunner-actions = { group = "com.acmerobotics.roadrunner", name = "actions", version.ref = "roadrunner-actions" }
roadrunner-ftc = { group = "com.acmerobotics.roadrunner", name = "ftc", version.ref = "roadrunner-ftc" }

[bundles]
ftc-sdk = [
    "ftc-inspection",
    "ftc-blocks",
    "ftc-robotcore",
    "ftc-robotserver",
    "ftc-onbotjava",
    "ftc-hardware",
    "ftc-ftccommon",
    "ftc-vision"
]
roadrunner = [
    "roadrunner-core",
    "roadrunner-actions",
    "roadrunner-ftc"
]

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
