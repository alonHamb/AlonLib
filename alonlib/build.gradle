//
// build.gradle for the alonlib library module
//

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'maven-publish'
}

android {
    namespace = 'org.firstinspires.ftc.teamcode.alonlib'
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // Bundled (api) so consumers get the FTC SDK transitively just by depending on
    // AlonLib, instead of having to declare it themselves.
    api libs.bundles.ftc.sdk

    api libs.solverslib.core

    api libs.bundles.roadrunner
    api libs.acmerobotics.dashboard

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.mockito:mockito-core:5.12.0")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1")
    // if using coroutines
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.alonHamb'
                artifactId = 'AlonLib'
            }
        }
    }
}
