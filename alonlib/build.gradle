import org.jetbrains.kotlin.gradle.dsl.JvmTarget

//
// build.gradle for the alonlib library module
//

plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    namespace = 'alonlib'
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17 // Change to your target version (e.g., JVM_11, JVM_17, JVM_21)
    }
}

dependencies {
    // Bundled (api) so consumers get the FTC SDK transitively just by depending on
    // AlonLib, instead of having to declare it themselves.
    api libs.bundles.ftc.sdk

    // Backs the internal Matrix wrapper (math.system) used by the ported LQR/Kalman/
    // LinearSystem code -- implementation-only so it doesn't leak onto consumers' classpath
    // unless they touch the estimator/system package.
    implementation libs.ejml.simple

    api libs.bundles.roadrunner
    api libs.acmerobotics.dashboard

    testImplementation(libs.junit)
    testImplementation(libs.mockito.core)
    testImplementation(libs.kotlinx.coroutines.test)
    // if using coroutines
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.alonHamb'
                artifactId = 'AlonLib'
            }
        }
    }
}
